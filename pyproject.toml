[project]
name = "medicalbot"
version = "0.1.0"
description = "AI agent to summarize medical records"
authors = [
    {name = "Luís",email = "luis.fmso.negrao@gmail.com"}
]
packages = [
    { include = "agent", from = "src" },
    { include = "agent_ui", from = "src" }
]
readme = "README.md"
requires-python = "==3.12.*"
dependencies = [
    "scikit-learn==1.5.2",
    "pandas (>=2.3.3,<3.0.0)",
    "numpy (>=2.3.4,<3.0.0)",
    "joblib (>=1.5.2,<2.0.0)",
    "boto3 (>=1.40.67,<2.0.0)",
    "pydantic==2.11.10",
    "langchain==1.1.2",
    "langchain_core==1.1.1",
    "langchain_aws==1.1.0"
]

[tool.poetry.group.ui.dependencies]
requests = ">=2.32.5,<3.0.0"
gradio = ">=5.49.1,<6.0.0"
pandas = ">=2.3.3,<3.0.0"

[tool.poetry.group.test.dependencies]
pytest = "9.0.1"
pydantic = "2.11.10"



[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"
